<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><title>Prueba corrector</title></head>
<body>
  <h1>Prueba del corrector</h1>

  <h3>1) Caja textarea</h3>
  <textarea rows="5" cols="60" placeholder="Escribe aquí con errores..."></textarea>

  <h3>2) Caja contenteditable (como WhatsApp, Gmail, Claude)</h3>
  <div contenteditable="true"
       style="border:1px solid #888;width:420px;min-height:90px;padding:6px;"></div>
</body>
</html>
